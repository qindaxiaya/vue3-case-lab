<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vue 3 案例库</title>
    <script>
      // 防闪白：在样式与 Vue 挂载前同步应用主题 class
      // 读取 localStorage 中保存的用户主题偏好（'dark' | 'light'），
      // 命中暗色则立即给 <html> 加 .dark，避免首屏白屏闪烁
      ;(function () {
        try {
          var theme = localStorage.getItem('moyu-theme')
          // localStorage 无记录时跟随系统暗色偏好
          if (
            theme === 'dark' ||
            (!theme &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          ) {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {
          // localStorage 被禁用（隐私模式等）时静默降级为浅色
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
