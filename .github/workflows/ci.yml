name: CI

# 每次推 main 或开 PR 都跑同一套门禁；也支持在 Actions 页面手动触发
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 只读仓库内容，够跑检查；不授予写权限
permissions:
  contents: read

# 同一分支的新提交会取消上一次未跑完的任务，避免排队浪费
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type check, lint, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 用 LTS 版本，和 package-lock 一起缓存 npm 下载
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # 严格按 lockfile 安装，lockfile 与 package.json 不一致会直接失败
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npx vitest run

      # build 内含 vue-tsc -b，额外验证产物可生成
      - name: Build
        run: npm run build
